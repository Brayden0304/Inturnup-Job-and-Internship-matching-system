{% extends "base.html" %}
{% block title %}Company profile{% endblock %}
{% block content %}
<h1>Company profile</h1>
<p class="muted">Accurate details help verify your listings faster.</p>

<div class="card form-narrow">
  <form method="POST">
    <div class="field">
      <label>Company Name</label>
      <input type="text" name="company_name" value="{{ profile.company_name }}" required minlength="2" maxlength="120" pattern="^[A-Za-z0-9À-ÖØ-öø-ÿ\s&',.\(\)/\-]{2,120}$" title="Please enter a valid company name (at least 2 characters, containing letters).">
    </div>
    <div class="form-row">
      <div class="field">
        <label>Industry</label>
        <input type="text" name="industry" maxlength="120" value="{{ profile.industry or '' }}" placeholder="E.g. Financial Services & Banking">
      </div>
      <div class="field">
        <label>Years in Operation</label>
        <input type="number" step="0.5" min="0" max="200" name="company_age_years" value="{{ profile.company_age_years or 1 }}">
      </div>
    </div>
    <div class="field">
      <label>Website</label>
      <input type="url" name="website" value="{{ profile.website or '' }}" placeholder="https://www.example.com">
      <div class="hint">Must be a valid web address starting with http:// or https://</div>
    </div>
    <div class="field">
      <label>Location</label>
      <input type="text" name="location" maxlength="120" value="{{ profile.location or '' }}" placeholder="E.g. Johannesburg, South Africa">
    </div>
    <div class="field">
      <label>About the Company</label>
      <textarea name="description" rows="4" placeholder="Brief summary of company culture, graduate tracks, and industry reach...">{{ profile.description or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Save changes</button>
  </form>
</div>
{% endblock %}
