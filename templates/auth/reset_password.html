{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="login-container">
  <div class="card form-narrow login-card">
    <div class="login-header">
      <div class="login-logo">
        <span class="brand-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>
      </div>
      <h2>Set New Password</h2>
      <p class="muted">Enter your new password below.</p>
    </div>

    <form method="POST">
      <div class="field">
        <label>New Password</label>
        <input type="password" name="password" required minlength="6" placeholder="Enter new password (min 6 characters)">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>

    <p class="muted" style="margin-top:1.5rem; text-align:center;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--gold-dark); font-weight:600;">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
