{% extends "base.html" %}
{% block title %}Registration{% endblock %}
{% block content %}
<div class="login-container registration-container">
  <div class="card form-narrow login-card registration-card">
    <div class="login-header">
      <h2 id="registerHeading" aria-live="polite">Register As A Student</h2>
      <p class="muted">Join the placement fellowship as an emerging candidate or corporate partner.</p>
    </div>

    <script type="application/json" id="approvedEmailDomains">{{ approved_domains | tojson }}</script>
    <form method="POST" id="registerForm" novalidate>
      <div class="role-tabs">
        <label class="role-tab active" id="tabStudent">
          <input type="radio" name="role" value="student" checked> Student
        </label>
        <label class="role-tab" id="tabCompany">
          <input type="radio" name="role" value="company"> Company
        </label>
      </div>

      <div class="field">
        <label id="nameLabel">Full Name</label>
        <input type="text" name="name" id="registerName" required placeholder="Enter your full name" autocomplete="name">
        <div class="hint" id="nameHint" style="display: none; color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem;"></div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" id="registerEmail" required placeholder="e.g. name@gmail.com" inputmode="email" maxlength="254" spellcheck="false" autocomplete="email">
        <div class="hint" id="emailHint" style="display: none; color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem;"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="registerPassword" required minlength="6" placeholder="Min 6 characters with letters, numbers &amp; symbols" style="padding-right: 3rem;" autocomplete="new-password">
          <button type="button" onclick="togglePassword('registerPassword', this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 0; display: flex; align-items: center; justify-content: center;" aria-label="Toggle password visibility">
            <svg id="registerPassword-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="registerPassword-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div class="hint" id="passwordHint" style="display: none; color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem;"></div>
        <div class="password-strength">
          <div class="strength-meter">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-text" id="strengthText">Password strength</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="muted" style="margin-top:1.5rem; text-align:center;">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color:var(--gold-dark); font-weight:600;">Log In</a>
    </p>
  </div>
</div>

<script>
function togglePassword(inputId, button) {
  const input = document.getElementById(inputId);
  const eyeIcon = document.getElementById(inputId + '-eye');
  const eyeOffIcon = document.getElementById(inputId + '-eye-off');

  if (input.type === 'password') {
    input.type = 'text';
    eyeIcon.style.display = 'none';
    eyeOffIcon.style.display = 'block';
  } else {
    input.type = 'password';
    eyeIcon.style.display = 'block';
    eyeOffIcon.style.display = 'none';
  }
}
</script>
{% endblock %}
