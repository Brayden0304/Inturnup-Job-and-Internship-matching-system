<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8E6F2D" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.8" />
  
  <!-- Subtle Internal Grid / Aura Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 8" />

  <!-- Dynamic Career Elevation Vector Symbol (Upward Arrow + Precision Monogram) -->
  <g filter="url(#shadow)">
    <!-- Diagonal Elevation Beam -->
    <line x1="168" y1="344" x2="344" y2="168" stroke="url(#goldGrad)" stroke-width="44" stroke-linecap="round" />
    <!-- Dynamic Arrowhead Wings -->
    <path d="M 216 168 L 344 168 L 344 296" fill="none" stroke="url(#goldGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Supporting Accent Arc -->
    <circle cx="168" cy="344" r="16" fill="url(#goldGrad)" />
  </g>
</svg>
